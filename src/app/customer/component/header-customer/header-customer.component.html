<nav class="modern-navbar">
  <div class="container-fluid nav-container">
    <!-- Brand -->
    <a class="navbar-brand" routerLink="home">
      <mat-icon class="brand-icon">storefront</mat-icon>
      <span class="brand-text">Hrafty</span>
    </a>

    <!-- Mobile Toggle -->
    <button class="navbar-toggler" type="button" (click)="isMenuOpen = !isMenuOpen" [class.open]="isMenuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Navigation Links -->
    <div class="navbar-menu" [class.show]="isMenuOpen">
      <ul class="nav-links">
        <li><a routerLink="home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a></li>
        <li><a routerLink="services" routerLinkActive="active">Services</a></li>
        <li><a routerLink="products" routerLinkActive="active">Products</a></li>
        <li><a routerLink="contact" routerLinkActive="active">Contact</a></li>
      </ul>

      <!-- User Controls -->
      <div class="user-controls">
        <!-- Cart -->
        <button mat-icon-button [matMenuTriggerFor]="cartMenu" class="cart-btn">
          <mat-icon [matBadge]="itemsQuantity" [matBadgeHidden]="!itemsQuantity">shopping_cart</mat-icon>
        </button>

        <mat-menu #cartMenu="matMenu" class="modern-menu">
          <div class="cart-dropdown p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <span class="fw-bold">{{itemsQuantity}} items</span>
              <a routerLink="cart" class="text-primary text-decoration-none">View Cart</a>
            </div>

            <div *ngIf="cart?.items?.length; else emptyCart" class="cart-items-list mb-3">
              <div *ngFor="let item of cart?.items" class="cart-item d-flex justify-content-between mb-2">
                <span>{{ item?.name }} <small class="text-muted">x {{ item?.quantity }}</small></span>
                <span class="fw-bold">{{ item?.price | currency }}</span>
              </div>
            </div>
            <ng-template #emptyCart>
              <p class="text-center text-muted my-3">Your cart is empty</p>
            </ng-template>

            <div class="cart-total d-flex justify-content-between mb-3 pt-2 border-top">
              <span>Total:</span>
              <span class="fw-bold text-primary">{{ getTotal(cart?.items) | currency }}</span>
            </div>

            <div class="cart-actions d-flex gap-2">
              <button mat-stroked-button color="warn" (click)="onClearCart()" class="flex-grow-1">
                <mat-icon>remove_shopping_cart</mat-icon> Clear
              </button>
              <button mat-raised-button color="primary" routerLink="cart" class="flex-grow-1">
                <mat-icon>shopping_cart_checkout</mat-icon> Checkout
              </button>
            </div>
          </div>
        </mat-menu>

        <!-- Profile -->
        <button mat-button [matMenuTriggerFor]="userMenu" class="profile-btn">
          <img *ngIf="customer" [src]="getCustomerImage()" class="profile-avatar" />
          <span class="profile-name">{{ user?.fullName || 'User' }}</span>
          <mat-icon>expand_more</mat-icon>
        </button>

        <mat-menu #userMenu="matMenu" class="modern-menu">
          <button mat-menu-item routerLink="/customer/profile">
            <mat-icon>person</mat-icon>
            <span>Profile</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logOut()">
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
          </button>
        </mat-menu>
      </div>
    </div>
  </div>
</nav>
