<nav class="modern-navbar">
  <div class="container-fluid nav-container">
    <!-- Brand -->
    <a class="navbar-brand" routerLink="home">
      <mat-icon class="brand-icon">storefront</mat-icon>
      <span class="brand-text">Hrafty</span>
    </a>

    <!-- Mobile Toggle -->
    <button class="navbar-toggler" type="button" (click)="isMenuOpen = !isMenuOpen" [class.open]="isMenuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Navigation Links -->
    <div class="navbar-menu" [class.show]="isMenuOpen">
      <ul class="nav-links">
        <li><a routerLink="home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a></li>
        <li><a routerLink="services" routerLinkActive="active">Services</a></li>
        <li><a routerLink="products" routerLinkActive="active">Products</a></li>
        <li><a routerLink="contact" routerLinkActive="active">Contact</a></li>
      </ul>

      <!-- Auth Buttons -->
      <div class="auth-buttons">
        <a routerLink="/login" class="btn-login">Login</a>
        <a routerLink="/signup" class="btn-signup">
          <span>Sign Up</span>
          <mat-icon>arrow_forward</mat-icon>
        </a>
      </div>
    </div>
  </div>
</nav>

<!-- Conditional Headers for Logged-in Users -->
<!-- Note: In a real app, you'd likely use a layout wrapper, but respecting existing structure -->
<app-header-customer *ngIf="isCustomerLoggedIn"></app-header-customer>
<app-header-seller *ngIf="isSellerLoggedIn"></app-header-seller>
